name: Update the Docker badges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update the versions
        run: sh scripts/update-docker-badges.sh README.md

      - name: Commit them when they changed
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "Forgejo Actions"
          git config user.email "actions@noreply.git.grenadine.io"
          git commit -qm "Update the Docker badges" -- README.md
          git push -q origin HEAD:main
